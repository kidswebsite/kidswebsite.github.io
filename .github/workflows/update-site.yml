name: Update site from email

on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 minutes
  workflow_dispatch:            # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch new emails
        if: github.event_name != 'push'
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SENDER_MAP: ${{ secrets.SENDER_MAP }}
        run: python scripts/fetch_mail.py

      - name: Rebuild pages
        run: python scripts/build.py

      - name: Commit any changes
        run: |
          git config user.name  "kids-site-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Update from email $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Another push may have landed while this run was working. Rebase onto
          # it and try again rather than failing the run.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main || exit 1
          done
          echo "could not push after 3 attempts"
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
